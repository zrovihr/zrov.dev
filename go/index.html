  <style>
    :root {
      --sea: #000;
      --land: #0c0d0e;
      --land-edge: #4a2f12;
      --road: #6e451c;
      --road-lit: #9a5f22;
      --frame: #d9821f;
      --amber: #df8a1e;
      --amber-d: #a9610f;
      --red: #c5251c;
      --red-d: #8d160f;
      --ink: #f2efe9;
      --label: 'Oswald', 'Arial Narrow', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: var(--ink);
      font-family: var(--label);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3vh 16px 5vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── GT2 yellow selection cursor ── */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 30px; height: 30px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity .25s;
      will-change: transform;
      filter: drop-shadow(1px 2px 1px rgba(0,0,0,.7));
    }
    .cursor.on { opacity: 1; }
    @media (hover: none) { .cursor { display: none; } }

    .stage {
      width: min(1180px, 100%);
      display: flex;
      gap: 18px;
      align-items: stretch;
    }

    .board {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      aspect-ratio: 16 / 10;
      border: 2px solid var(--frame);
      background: var(--sea);
      overflow: hidden;
      box-shadow: 0 0 0 1px #000, 0 14px 44px rgba(0,0,0,.7);
    }
    .board__map {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* ── icon node ── */
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      width: 124px;
      z-index: 2;
      transition: transform .09s ease;
    }
    .node:hover { transform: translate(-50%, -50%) scale(1.09); z-index: 3; }
    .node:active { transform: translate(-50%, -50%) scale(1.03); }

    .tile {
      width: 52px; height: 52px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--amber);
      border: 1px solid var(--amber-d);
    }
    .node.is-red .tile { background: var(--red); border-color: var(--red-d); }
    .node:hover .tile { outline: 2px solid #fff; outline-offset: 1px; }
    .tile svg { width: 30px; height: 30px; fill: #100b04; }
    .node.is-red .tile svg { fill: #fff; }

    .label {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 3px #000, 0 1px 2px #000, 1px 0 1px #000, -1px 0 1px #000;
    }
    .sub {
      font-weight: 500; font-size: 10.5px; letter-spacing: .4px;
      color: #e7b56e; text-transform: lowercase; margin-top: -1px;
      text-shadow: 0 1px 2px #000;
    }

    /* ── side text list (for people who hate the map) ── */
    .sidelist {
      flex: 0 0 210px;
      border: 2px solid var(--frame);
      background: #0a0805;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
    }
    .sidelist__h {
      font-weight: 700; font-size: 12px; letter-spacing: 2px;
      color: var(--frame); text-transform: uppercase;
      padding-bottom: 9px; margin-bottom: 6px;
      border-bottom: 1px solid #3a2710;
    }
    .sidelist__grp {
      font-weight: 600; font-size: 10px; letter-spacing: 1.5px;
      color: #7a6645; text-transform: uppercase;
      margin: 12px 0 3px;
    }
    .sidelist a {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 4px; text-decoration: none;
      color: #d8d2c7; font-size: 14px; letter-spacing: .3px;
      border-bottom: 1px solid #1b1408;
    }
    .sidelist a:last-child { border-bottom: 0; }
    .sidelist a:hover { color: #fff; }
    .sidelist a:hover svg { fill: var(--frame); }
    .sidelist svg { width: 15px; height: 15px; fill: #8a6a36; flex: none; }
    .sidelist a.red svg { fill: var(--red); }

    /* ── plate / wordmark ── */
    .plate { margin-top: 22px; text-align: center; }
    .word {
      font-weight: 700;
      font-size: clamp(32px, 5.5vw, 48px);
      letter-spacing: 3px;
      line-height: .9;
      color: #fff;
    }
    .word .dot { color: var(--frame); }
    .word .dev { color: var(--frame); font-weight: 600; }
    .tagline {
      margin-top: 7px;
      font-weight: 600; font-size: 12px; letter-spacing: 4px;
      color: #8a8f96; text-transform: uppercase;
    }
    .backlink { margin-top: 16px; }
    .backlink a {
      font-weight: 600; font-size: 12px; letter-spacing: 1.5px;
      color: #8a8f96; text-decoration: none; text-transform: uppercase;
    }
    .backlink a:hover { color: var(--frame); }

    /* ── stack the side list under the map on narrower screens ── */
    @media (max-width: 860px) {
      .stage { flex-direction: column; }
      .sidelist { flex: 1 1 auto; }
      .sidelist__links { columns: 2; column-gap: 18px; }
      .sidelist a { break-inside: avoid; }
    }

    /* ── mobile: drop the map, become a grid ── */
    @media (max-width: 620px) {
      .board { aspect-ratio: auto; padding: 22px 10px 26px; }
      .board__map { object-fit: cover; opacity: .55; }
      .nodes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 4px; position: relative; z-index: 2; }
      .node { position: static; transform: none; width: auto; }
      .node:hover { transform: scale(1.06); }
      .label { font-size: 14px; }
      .sidelist__links { columns: 1; }
    }
  </style>
</head>

  <script>
    // ── GT2 cursor: glides at a constant speed toward the last-hovered button ──
    (function () {
      const cursor = document.getElementById('cursor');
      if (!cursor) return;

      // arrow art: tip is near the top-left of the 30px box → offset so the tip lands on target
      const TIP_X = 5, TIP_Y = 3;           // tip position inside the 30x30 svg
      const SPEED = 1400;                   // px per second, constant
      const targets = document.querySelectorAll('.node, .sidelist a');

      let cx = window.innerWidth / 2, cy = window.innerHeight / 2;  // current pos
      let tx = cx, ty = cy;                 // target pos
      let active = false;
      let last = null;

      function aim(el) {
        const r = el.getBoundingClientRect();
        // aim at the upper-left-ish of the element, like a pointer resting on it
        tx = r.left + Math.min(26, r.width * 0.32);
        ty = r.top + Math.min(22, r.height * 0.30);
        if (!active) { active = true; cursor.classList.add('on'); }
      }

      targets.forEach(el => {
        el.addEventListener('mouseenter', () => aim(el));
        el.addEventListener('focus', () => aim(el));
      });

      // keep the target glued to the element while scrolling/resizing
      function reaim() { if (last) aim(last); }
      targets.forEach(el => el.addEventListener('mouseenter', () => last = el));
      window.addEventListener('scroll', reaim, { passive: true });
      window.addEventListener('resize', reaim);

      let prev = null;
      function tick(now) {
        if (prev == null) prev = now;
        const dt = Math.min(0.05, (now - prev) / 1000);  // clamp big gaps
        prev = now;

        const dx = tx - cx, dy = ty - cy;
        const dist = Math.hypot(dx, dy);
        const step = SPEED * dt;                          // constant speed
        if (dist <= step || dist < 0.5) {
          cx = tx; cy = ty;
        } else {
          cx += (dx / dist) * step;
          cy += (dy / dist) * step;
        }
        cursor.style.transform =
          'translate(' + (cx - TIP_X) + 'px,' + (cy - TIP_Y) + 'px)';
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
